<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Creative Lens</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="title">Creative Lens <span id="auth" class="auth"></span></div>
    <form id="form" class="form">
      <input id="pkg" placeholder="Package, vd com.ig.screwdom" spellcheck="false" autocomplete="off">
      <div class="row2">
        <select id="range">
          <option value="7">7 ngày</option>
          <option value="14">14 ngày</option>
          <option value="30" selected>30 ngày</option>
          <option value="90">90 ngày</option>
          <option value="custom">Tuỳ chọn</option>
        </select>
        <button id="go" type="submit">Phân tích</button>
      </div>
      <div id="custom" class="row2 dates" hidden><input id="start" type="date"><input id="end" type="date"></div>
    </form>
  </header>
  <div id="msg" class="msg" hidden></div>
  <section id="result" hidden>
    <div id="summary" class="summary"></div>
    <nav id="chips" class="chips"></nav>
    <nav id="tabs" class="tabs">
      <button type="button" data-tab="top" class="on">Top</button>
      <button type="button" data-tab="cadence">Nhịp mới</button>
      <button type="button" data-tab="geo">Geo</button>
      <button type="button" data-tab="specs">Thông số</button>
    </nav>
    <main id="view"></main>
    <footer>
      <button id="export" type="button">Xuất Excel</button>
      <span class="muted">cnt = Times Detected · imp chỉ là ước lượng</span>
    </footer>
  </section>
  <script src="vendor/xlsx.full.min.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
